services:
  ingest:
    image: ghcr.io/qquiqlerr/second-brain:latest
    pull_policy: always
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Europe/Moscow
      NOTES_DIR: /data/notes
      CONFIG_DIR: /etc/second-brain
      INDEX_DB_PATH: /data/index/index.db
    volumes:
      - ./data/notes:/data/notes
      - ./data/index:/data/index
      - ./config:/etc/second-brain

  quartz:
    build:
      context: ./quartz
    restart: unless-stopped
    environment:
      QUARTZ_BUILD_INTERVAL_SEC: "300"
    volumes:
      - ./data/notes:/content:ro
      - ./data/quartz-public:/output

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      # Non-standard port: host already runs nginx on :80/:443 for unrelated
      # projects. Hit https://<vps-ip>:8443/.
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/quartz-public:/srv:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
