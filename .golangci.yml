version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - gofmt
    - goimports
    - errorlint
    - nilerr
    - nilnil
    - bodyclose
    - contextcheck
    - copyloopvar
    - prealloc

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - revive
